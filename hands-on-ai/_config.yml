#######################################################################################
# Jupyter Book configuration
# Docs: https://jupyterbook.org/en/stable/customize/config.html
#######################################################################################

# --- Book meta ---
title       : Hands-On AI
author      : KI-Lab hfg Offenbach
copyright   : "2025"
logo        : img/logo.gif
# favicon   : img/favicon.ico   # (optional)

# --- Execution ---
execute:
  execute_notebooks: "off"      # don't execute during build
  timeout: -1                   # (ignored when execute_notebooks=off)

# --- LaTeX / PDF ---
latex:
  latex_documents:
    targetname: book.tex

# --- Repository integration (links in header, edit links, etc.) ---
repository:
  url: https://github.com/attributeerror39/Hands-On-AI
  path_to_book: .               # book lives at repo root
  branch: main

html:
  use_issues_button: true
  use_repository_button: true
  # For GitHub Pages project site: use the full absolute URL with correct casing
  html_baseurl: https://attributeerror39.github.io/Hands-On-AI/
  # Optional, but good for SEO/sitemaps if baseurl is set:
  google_analytics_id: ""       # e.g. G-XXXXXXXX (optional)

sphinx:
  # You can add or remove Sphinx extensions here
  config:
    html_show_copyright: true
    html_theme_options:
      navigation_with_keys: true
      collapse_navigation: False
    # Create a sitemap when html_baseurl is set
    extensions:
      - sphinx_sitemap
    sitemap_url_scheme: "{link}"  # cleaner URLs in sitemap

# --- MyST / Markdown options (optional, tweak as you like) ---
parse:
  myst_enable_extensions:
    - colon_fence         # ::: fenced blocks
    - deflist             # definition lists
    - dollarmath          # $ math $
    - linkify             # auto-detect links
    - substitution        # |placeholders|
  myst_url_schemes: [mailto, http, https]

# --- Patterns to exclude from the build (optional, but often handy) ---
exclude_patterns:
  - .github/
  - .gitignore
  - README.md
  - "**/.ipynb_checkpoints/*"
  - "**/.DS_Store"

# --- Launch buttons (optional; show "launch" in Colab/MyBinder, etc.) ---
# launch_buttons:
#   colab_url: "https://colab.research.google.com"
#   binderhub_url: "https://mybinder.org"
#   notebook_interface: "jupyterlab"

# --- Comments / annotations (optional) ---
# comments:
#   hypothesis: true

#######################################################################################
# End config
#######################################################################################
