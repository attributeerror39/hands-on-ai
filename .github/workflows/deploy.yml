name: deploy-book

on:
  push:
    branches: [ main ]

env:
  # If you rely on a base URL, keep this; otherwise you can remove it.
  BASE_URL: /${{ github.event.repository.name }}
  BOOK_DIR: hands-on-ai

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Ensure jupyter-book is present even if it's missing in requirements.txt
          python -c "import jupyter_book" 2>/dev/null || pip install jupyter-book

      - name: Show repo layout (debug)
        run: |
          echo "Top-level:"
          ls -la
          echo "BOOK_DIR:"
          ls -la "$BOOK_DIR" || true

      # Configure GitHub Pages (recommended)
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build the book
        run: |
          # Fail on warnings so we don't proceed to upload on a broken build
          jupyter-book build "$BOOK_DIR"
        # If your book uses notebooks requiring kernel, add any needed installs above

      - name: List built HTML (debug)
        run: |
          echo "Listing $BOOK_DIR/_build/html"
          ls -la "$BOOK_DIR/_build/html" || true
          echo "Listing $BOOK_DIR/_build"
          ls -la "$BOOK_DIR/_build" || true

      # Upload artifact only if the output exists
      - name: Upload artifact
        if: ${{ hashFiles(format('{0}/_build/html/index.html', env.BOOK_DIR)) != '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: "${{ env.BOOK_DIR }}/_build/html"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show deployed Pages URL
        run: |
          echo "Deployed Pages URL: ${{ steps.deployment.outputs.page_url }}"
